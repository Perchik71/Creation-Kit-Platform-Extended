[[evidence]]
class = "BGSLayer"
size = 0x60
kind = "exact"
versions = ["246"]
note = "ConcreteFormFactory<BGSLayer> Create allocates the complete object through the diagnostic-identified MemoryManager allocator. Zero R9 plus 0x60 supplies EDX."
proof = [
  { version = "246", rva = 0x4642A2, expect = "xor r9d, r9d" },
  { version = "246", rva = 0x4642AF, expect = { text = "lea edx, [r9 + 0x60]", displacement = 0x60 } },
  { version = "246", rva = 0x4642B3, expect = { mnemonic = "call", immediate = 0x4978D } },
]

